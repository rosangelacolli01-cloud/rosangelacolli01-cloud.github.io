<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Rosângela Colli</title>
  <meta name="robots" content="noindex, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: var(--space-8) var(--container-padding);
    }
    .not-found-code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      margin-bottom: var(--space-4);
      font-family: var(--font-display);
    }
    .not-found-desc {
      margin-inline: auto;
      margin-bottom: var(--space-8);
      max-width: 44ch;
    }
  </style>
</head>
<body>
  <main class="not-found-page">
    <div class="brand-mark" style="margin-bottom: var(--space-6);" aria-hidden="true">RC</div>
    <div class="not-found-code">404</div>
    <h1 class="section-title" style="font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: var(--space-3);" data-i18n="notfound.title">Página não encontrada</h1>
    <p class="not-found-desc" data-i18n="notfound.desc">O link que você tentou acessar não existe ou mudou de endereço.</p>
    <a href="index.html" class="btn btn-primary" data-i18n="notfound.back">Voltar para o início</a>
  </main>
</body>
</html>
